name: Validation evidence
description: Propose reviewed Jetson, benchmark, demo, or deployment evidence.
title: "[Evidence]: "
labels: [validation]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Evidence scope
      options:
        - Jetson build / CUDA offload
        - Text performance / KV reuse
        - Single-image VLM smoke
        - RAG / citation behavior
        - Resource / power / stability
        - Offline delivery rehearsal
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Environment and measurement contract
      description: Record commits, model hashes, device/L4T/CUDA/power mode, inputs, repetitions and metric definitions.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized artifacts and commands
      description: Link small reviewed outputs; do not attach raw models, indexes, private data or long logs.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limitations and claims not supported
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I did not fabricate, extrapolate, or silently remove failed samples.
          required: true
        - label: I followed docs/benchmark-protocol.md when performance is in scope.
          required: true
