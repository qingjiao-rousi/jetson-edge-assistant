name: Bug report
description: Report a reproducible EdgeOmni defect without private assets.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the smallest reproducible behavior and sanitized error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revisions
      description: EdgeOmni commit, submodule commit, OS/L4T/CUDA, architecture, and model SHA-256 prefix if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and validation
      description: Commands, whether assets/hardware are required, and the output of model-free checks.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: I removed model bytes, private manuals, secrets, serial numbers, host paths, and unbounded logs.
          required: true
        - label: I am not interpreting synthetic knowledge or fixtures as real maintenance guidance.
          required: true
